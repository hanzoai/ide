name: Release Hanzo IDE (Forge)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty to use package.json)'
        required: false
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

defaults:
  run:
    working-directory: ./

jobs:
  prebuild:
    name: Prebuild & Version Check
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get npm package version
        id: package-version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Release version: $VER"

  release-hanzo-ide:
    needs: prebuild
    name: Release Hanzo IDE (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            arch: x86_64-unknown-linux-gnu
            os: [hanzo-build-linux-amd64]
            tauri_target: ''
            installer_glob: 'appimage/*.AppImage'
            updater_glob: 'appimage/*.AppImage.tar.gz'
            stable_name: hanzo-ide-linux.AppImage
            stable_alias: hanzo-linux.AppImage
            stable_deb: hanzo-ide-linux.deb
            stable_deb_alias: hanzo-linux.deb

          - id: macos-universal
            arch: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            tauri_target: 'universal-apple-darwin'
            installer_glob: 'dmg/*.dmg'
            updater_glob: 'macos/*.app.tar.gz'
            stable_name: hanzo-ide-macos.dmg
            stable_alias: hanzo-macos.dmg
            stable_deb: ''
            stable_deb_alias: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: (Unix) Ensure Rust toolchain on PATH
        shell: bash
        run: |
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          elif ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain >/dev/null 2>&1 || rustup default stable

      - name: (macOS) Add universal Rust targets
        if: ${{ matrix.arch == 'aarch64-apple-darwin' }}
        shell: bash
        run: |
          RUSTUP="$(command -v rustup || echo "$HOME/.cargo/bin/rustup")"
          "$RUSTUP" target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build web IDE assets
        run: npm run build

      - name: (Linux) Build Hanzo IDE
        if: ${{ contains(matrix.arch, 'linux') }}
        run: npx tauri build --verbose --ignore-version-mismatches
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: (macOS) Build Hanzo IDE (universal)
        if: ${{ matrix.arch == 'aarch64-apple-darwin' }}
        run: npx tauri build --target universal-apple-darwin --ignore-version-mismatches
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Discover build artifacts
        id: artifacts
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          if [ -n "${{ matrix.tauri_target }}" ]; then
            BUNDLE="src-tauri/target/${{ matrix.tauri_target }}/release/bundle"
          else
            BUNDLE="src-tauri/target/release/bundle"
          fi
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          inst=("$BUNDLE"/${{ matrix.installer_glob }})
          if [ ${#inst[@]} -eq 0 ]; then
            echo "::error::No installer matched $BUNDLE/${{ matrix.installer_glob }}"
            ls -R "$BUNDLE" || true
            exit 1
          fi
          echo "installer=${inst[0]}" >> "$GITHUB_OUTPUT"
          echo "Discovered installer: ${inst[0]}"

      - name: Stage release files
        id: stage
        shell: bash
        env:
          VERSION: ${{ needs.prebuild.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.artifacts.outputs.bundle }}"
          ID="${{ matrix.id }}"
          installer="${{ steps.artifacts.outputs.installer }}"
          ext="${installer##*.}"
          mkdir -p dist-release dist-latest

          cp "$installer" "dist-release/Hanzo-IDE-${VERSION}-${ID}.${ext}"
          cp "$installer" "dist-release/${{ matrix.stable_name }}"
          cp "$installer" "dist-release/${{ matrix.stable_alias }}"
          cp "$installer" "dist-latest/${{ matrix.stable_name }}"
          cp "$installer" "dist-latest/${{ matrix.stable_alias }}"

          if [ -n "${{ matrix.stable_deb }}" ]; then
            deb=$(ls $BUNDLE/deb/*.deb 2>/dev/null | head -n1 || true)
            if [ -n "$deb" ]; then
              cp "$deb" "dist-release/Hanzo-IDE-${VERSION}-${ID}.deb"
              cp "$deb" "dist-release/${{ matrix.stable_deb }}"
              cp "$deb" "dist-release/${{ matrix.stable_deb_alias }}"
              cp "$deb" "dist-latest/${{ matrix.stable_deb }}"
              cp "$deb" "dist-latest/${{ matrix.stable_deb_alias }}"
            fi
          fi

      - name: Upload binaries to R2
        continue-on-error: true
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://54bf1bf573b3e6471e574cc4d318db64.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: hanzo-download
          source_dir: dist-release
          destination_dir: ./hanzo-ide/binaries/production/${{ matrix.arch }}/${{ needs.prebuild.outputs.version }}.${{ github.run_number }}/

      - name: Upload stable aliases to R2 (latest)
        continue-on-error: true
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://54bf1bf573b3e6471e574cc4d318db64.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: hanzo-download
          source_dir: dist-latest
          destination_dir: ./hanzo-ide/latest/
