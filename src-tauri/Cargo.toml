[package]
name = "hanzo"
version = "0.1.0"
description = "AI-native IDE built in Rust"
authors = ["Eli Bury <eli@hanzo.ai>"]
license = "Apache-2.0"
repository = "https://github.com/hanzoai/ide"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
tokio.workspace = true
uuid.workspace = true
async-trait.workspace = true

tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Serve the bundled frontend over http://localhost in release so VS Code
# extension webviews can register service workers (WKWebView rejects them
# on the tauri:// custom protocol). Dev already runs on http://localhost.
tauri-plugin-localhost = "2.3.2"

# Utility (used in lib.rs for multi-window URL encoding)
urlencoding = "2"

# Hanzo engine — agent loop, providers, sessions, MCP, atoms (extracted from Hanzo AI)
hanzo-engine = { path = "../crates/hanzo-engine", default-features = false }

# Hanzo ↔ Hanzo AI bridge — hook implementations
hanzo-bridge = { path = "../crates/hanzo-bridge" }

# Hanzo Shell — terminal, git, LSP, DAP, watcher, search, extensions
hanzo-shell = { path = "../crates/hanzo-shell" }

# Hanzo AI — AST indexer, WASM skills, tool executor, diff editor
hanzo-ai = { path = "../crates/hanzo-ai" }
